[project]
name = "mcp-sharepoint"
version = "0.1.0"
description = "A stateless MCP server for searching and reading SharePoint documents through Microsoft Graph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "azure-identity>=1.19,<2",
    "charset-normalizer>=3.4,<4",
    "httpx>=0.27,<1",
    "mcp>=1.13,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-pptx>=1,<2",
]

[project.scripts]
mcp-sharepoint = "mcp_sharepoint.server:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_sharepoint"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
